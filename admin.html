<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Central+ • Administração</title>


    <script>

        if (
            sessionStorage.getItem("centralAdmin")
            !== "true"
        ) {

            window.location.href =
                "admin-login.html";

        }

    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        :root {

            --bg: #070809;

            --sidebar: #0b0d0f;

            --card: #101214;

            --card2: #141719;

            --border: #202428;

            --text: #f1f3f4;

            --muted: #858b91;

            --green: #00e887;

            --green-dark: #073b29;

            --red: #ff5f67;

            --red-dark: #40181b;

            --yellow: #ffc857;

            --blue: #5c9dff;

        }


        body {

            margin: 0;

            background: var(--bg);

            color: var(--text);

            font-family:
                Inter,
                Arial,
                sans-serif;

        }


        button,
        input,
        select {

            font: inherit;

        }


        button {

            cursor: pointer;

        }


        /* =========================
           TOPBAR
        ========================= */

        .topbar {

            height: 70px;

            position: fixed;

            top: 0;

            left: 0;

            right: 0;

            z-index: 100;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 25px;

            background:
                rgba(11,13,15,.96);

            backdrop-filter:
                blur(15px);

            border-bottom:
                1px solid var(--border);

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

            font-size: 20px;

            font-weight: 800;

        }


        .brand-icon {

            width: 38px;

            height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            background:
                var(--green);

            color: #000;

            font-weight: 900;

        }


        .brand span {

            color: var(--green);

        }


        .top-right {

            display: flex;

            align-items: center;

            gap: 18px;

        }


        .online {

            display: flex;

            align-items: center;

            gap: 7px;

            color: var(--muted);

            font-size: 12px;

        }


        .online-dot {

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background:
                var(--green);

        }


        .admin-user {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 7px 10px;

            border:
                1px solid var(--border);

            border-radius: 10px;

        }


        .avatar {

            width: 30px;

            height: 30px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 8px;

            background: #1b2024;

            font-size: 14px;

        }


        .admin-name {

            font-size: 12px;

            font-weight: bold;

        }


        .admin-role {

            color: var(--green);

            font-size: 10px;

        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {

            position: fixed;

            top: 70px;

            bottom: 0;

            left: 0;

            width: 245px;

            padding: 22px 14px;

            background:
                var(--sidebar);

            border-right:
                1px solid var(--border);

            overflow-y: auto;

        }


        .menu-label {

            margin:
                12px 10px 9px;

            color: #555b61;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: .8px;

            text-transform:
                uppercase;

        }


        .menu {

            width: 100%;

            display: flex;

            align-items: center;

            gap: 12px;

            padding:
                11px 12px;

            margin-bottom: 3px;

            border: 0;

            border-radius: 9px;

            background:
                transparent;

            color: #8d949b;

            text-align: left;

            font-size: 13px;

            transition:
                .15s ease;

        }


        .menu:hover {

            background: #131619;

            color: #fff;

        }


        .menu.active {

            background:
                linear-gradient(
                    90deg,
                    #123528,
                    #10251d
                );

            color:
                var(--green);

        }


        .menu-icon {

            width: 22px;

            text-align: center;

            font-size: 15px;

        }


        .badge {

            margin-left: auto;

            min-width: 20px;

            padding: 3px 6px;

            border-radius: 5px;

            background:
                var(--red-dark);

            color:
                var(--red);

            font-size: 9px;

            text-align: center;

        }


        .sidebar-bottom {

            margin-top: 25px;

            padding-top: 15px;

            border-top:
                1px solid var(--border);

        }


        /* =========================
           CONTENT
        ========================= */

        .content {

            margin-left: 245px;

            padding:
                100px 32px 40px;

            min-height: 100vh;

        }


        .page {

            display: none;

            animation:
                fadeIn .2s ease;

        }


        .page.active {

            display: block;

        }


        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(4px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        .page-header {

            display: flex;

            align-items:
                flex-end;

            justify-content:
                space-between;

            gap: 20px;

            margin-bottom: 25px;

        }


        .eyebrow {

            margin-bottom: 7px;

            color:
                var(--green);

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1px;

        }


        .page-header h1 {

            margin: 0;

            font-size: 27px;

        }


        .page-header p {

            margin:
                7px 0 0;

            color:
                var(--muted);

            font-size: 13px;

        }


        /* =========================
           BUTTONS
        ========================= */

        .btn {

            border: 0;

            border-radius: 8px;

            padding:
                10px 14px;

            font-size: 12px;

            font-weight: 700;

            transition: .15s;

        }


        .btn:hover {

            transform:
                translateY(-1px);

        }


        .btn-green {

            background:
                var(--green);

            color: #000;

        }


        .btn-red {

            background:
                var(--red-dark);

            color:
                var(--red);

        }


        .btn-dark {

            background:
                #1b1e21;

            color: #ddd;

            border:
                1px solid var(--border);

        }


        .btn-blue {

            background: #142b49;

            color:
                var(--blue);

        }


        /* =========================
           STATS
        ========================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(0,1fr)
                );

            gap: 14px;

            margin-bottom: 20px;

        }


        .stat {

            position: relative;

            padding: 19px;

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius: 13px;

            overflow: hidden;

        }


        .stat::after {

            content: "";

            position: absolute;

            width: 60px;

            height: 60px;

            right: -20px;

            bottom: -20px;

            border-radius: 50%;

            background:
                rgba(0,232,135,.04);

        }


        .stat-top {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            margin-bottom: 15px;

        }


        .stat-icon {

            width: 33px;

            height: 33px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 8px;

            background:
                #171b1e;

        }


        .stat-change {

            color:
                var(--green);

            font-size: 10px;

        }


        .stat-value {

            font-size: 24px;

            font-weight: 800;

        }


        .stat-title {

            margin-top: 5px;

            color:
                var(--muted);

            font-size: 11px;

        }


        /* =========================
           GRID
        ========================= */

        .grid {

            display: grid;

            grid-template-columns:
                1.6fr 1fr;

            gap: 18px;

        }


        .panel {

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius: 13px;

            overflow: hidden;

        }


        .panel-header {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            padding:
                17px 19px;

            border-bottom:
                1px solid var(--border);

        }


        .panel-header h2 {

            margin: 0;

            font-size: 14px;

        }


        .panel-header span {

            color:
                var(--muted);

            font-size: 10px;

        }


        .panel-body {

            padding: 18px;

        }


        /* =========================
           ACTIVITY
        ========================= */

        .activity {

            display: flex;

            gap: 12px;

            padding:
                13px 0;

            border-bottom:
                1px solid #191d20;

        }


        .activity:last-child {

            border-bottom: 0;

        }


        .activity-icon {

            width: 32px;

            height: 32px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 8px;

            background: #171b1e;

        }


        .activity-text {

            font-size: 12px;

        }


        .activity-time {

            margin-top: 4px;

            color:
                var(--muted);

            font-size: 10px;

        }


        /* =========================
           TABLE
        ========================= */

        .table-wrap {

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse:
                collapse;

            min-width: 700px;

        }


        th {

            padding:
                13px 16px;

            color: #666d73;

            background:
                #0d0f11;

            font-size: 9px;

            text-align: left;

            text-transform:
                uppercase;

        }


        td {

            padding:
                14px 16px;

            border-top:
                1px solid #1a1d20;

            font-size: 12px;

        }


        .user-cell {

            display: flex;

            align-items: center;

            gap: 9px;

        }


        .user-avatar {

            width: 30px;

            height: 30px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 8px;

            background:
                #191d20;

        }


        .user-name {

            font-weight: 700;

        }


        .user-id {

            margin-top: 2px;

            color:
                var(--muted);

            font-size: 9px;

        }


        /* =========================
           STATUS
        ========================= */

        .status {

            display: inline-flex;

            align-items: center;

            gap: 5px;

            padding:
                5px 8px;

            border-radius: 6px;

            font-size: 9px;

            font-weight: 800;

        }


        .status.green {

            background:
                var(--green-dark);

            color:
                var(--green);

        }


        .status.red {

            background:
                var(--red-dark);

            color:
                var(--red);

        }


        .status.yellow {

            background:
                #3b3008;

            color:
                var(--yellow);

        }


        /* =========================
           SEARCH
        ========================= */

        .toolbar {

            display: flex;

            gap: 10px;

            margin-bottom: 15px;

        }


        .search {

            flex: 1;

            padding:
                11px 13px;

            background:
                var(--card);

            color: #fff;

            border:
                1px solid var(--border);

            border-radius: 9px;

            outline: none;

        }


        .search:focus {

            border-color:
                var(--green);

        }


        /* =========================
           ACCESS CARDS
        ========================= */

        .access-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        240px,
                        1fr
                    )
                );

            gap: 14px;

        }


        .access-card {

            padding: 18px;

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius: 13px;

        }


        .access-header {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            margin-bottom: 14px;

        }


        .access-product {

            font-size: 14px;

            font-weight: 800;

        }


        .access-price {

            color:
                var(--green);

            font-weight: 800;

        }


        .access-description {

            margin-bottom: 15px;

            color:
                var(--muted);

            font-size: 11px;

            line-height: 1.5;

        }


        /* =========================
           ADMIN CARDS
        ========================= */

        .admin-card {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 15px;

            padding: 15px;

            margin-bottom: 8px;

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius: 11px;

        }


        .admin-info {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .admin-avatar {

            width: 38px;

            height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 9px;

            background:
                #171b1e;

        }


        .role {

            margin-top: 3px;

            color:
                var(--green);

            font-size: 9px;

        }


        /* =========================
           FORM
        ========================= */

        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0,1fr)
                );

            gap: 13px;

        }


        .field {

            display: flex;

            flex-direction:
                column;

            gap: 6px;

        }


        .field.full {

            grid-column:
                1 / -1;

        }


        .field label {

            color:
                var(--muted);

            font-size: 10px;

        }


        .field input,
        .field select {

            width: 100%;

            padding: 11px;

            background:
                #0c0e10;

            color: #fff;

            border:
                1px solid var(--border);

            border-radius: 8px;

            outline: none;

        }


        .field input:focus,
        .field select:focus {

            border-color:
                var(--green);

        }


        /* =========================
           EMPTY
        ========================= */

        .empty {

            padding: 30px;

            color:
                var(--muted);

            text-align: center;

            font-size: 12px;

        }


        /* =========================
           TOAST
        ========================= */

        .toast {

            position: fixed;

            right: 25px;

            bottom: 25px;

            z-index: 500;

            padding:
                13px 16px;

            background:
                #15191c;

            border:
                1px solid var(--border);

            border-left:
                3px solid var(--green);

            border-radius: 9px;

            box-shadow:
                0 10px 35px #000;

            font-size: 12px;

            transform:
                translateY(100px);

            opacity: 0;

            transition: .25s;

        }


        .toast.show {

            transform:
                translateY(0);

            opacity: 1;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 950px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);

            }

            .grid {

                grid-template-columns:
                    1fr;

            }

        }


        @media (max-width: 700px) {

            .sidebar {

                width: 100%;

                height: auto;

                position: fixed;

                top: 70px;

                bottom: auto;

                z-index: 90;

                display: flex;

                overflow-x: auto;

                padding: 8px;

            }

            .menu-label,
            .sidebar-bottom {

                display: none;

            }

            .menu {

                min-width: 120px;

                justify-content: center;

            }

            .content {

                margin-left: 0;
