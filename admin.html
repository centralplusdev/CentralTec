<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Central+ • Painel Administrativo</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {

    --bg: #060708;
    --sidebar: #0b0d0f;
    --card: #101315;
    --card2: #14181b;
    --border: #202529;

    --text: #f5f7f8;
    --muted: #858d94;

    --green: #00e887;
    --green-dark: #073b2a;

    --red: #ff5964;
    --red-dark: #3b171b;

    --yellow: #ffc857;
    --blue: #5c9dff;

}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(0,232,135,.08),
            transparent 30%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(0,232,135,.04),
            transparent 30%
        ),
        var(--bg);

    color: var(--text);

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;

}


/* =========================
   LOADING
========================= */

.loading {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #060708;

    transition: opacity .5s ease;

}

.loading.hide {

    opacity: 0;

    pointer-events: none;

}

.loader {

    width: 45px;

    height: 45px;

    border:
        3px solid #202529;

    border-top-color:
        var(--green);

    border-radius: 50%;

    animation:
        spin .8s linear infinite;

}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================
   HEADER
========================= */

.header {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 70px;

    z-index: 1000;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 25px;

    background:
        rgba(8,10,11,.88);

    backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid var(--border);

}


.logo {

    display: flex;

    align-items: center;

    gap: 11px;

    font-size: 20px;

    font-weight: 900;

}


.logo-icon {

    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background:
        var(--green);

    color: #000;

    font-size: 12px;

    box-shadow:
        0 0 25px rgba(0,232,135,.15);

}


.logo span {

    color:
        var(--green);

}


.header-right {

    display: flex;

    align-items: center;

    gap: 15px;

}


.system-status {

    display: flex;

    align-items: center;

    gap: 7px;

    color:
        var(--muted);

    font-size: 10px;

}


.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background:
        var(--green);

    box-shadow:
        0 0 10px var(--green);

    animation:
        pulse 2s infinite;

}

@keyframes pulse {

    0%,100% {
        opacity: 1;
    }

    50% {
        opacity: .45;
    }

}


.profile {

    display: flex;

    align-items: center;

    gap: 9px;

    padding:
        6px 10px;

    border:
        1px solid var(--border);

    border-radius: 9px;

    background:
        rgba(255,255,255,.015);

}


.profile-icon {

    width: 30px;
    height: 30px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 8px;

    background:
        #1b2024;

}


.profile-name {

    font-size: 11px;

    font-weight: 800;

}


.profile-role {

    margin-top: 2px;

    color:
        var(--green);

    font-size: 8px;

}


/* =========================
   SIDEBAR
========================= */

.sidebar {

    position: fixed;

    top: 70px;
    bottom: 0;
    left: 0;

    width: 240px;

    z-index: 900;

    padding:
        22px 13px;

    background:
        rgba(10,12,14,.94);

    border-right:
        1px solid var(--border);

}


.section-label {

    margin:
        12px 10px 8px;

    color:
        #515960;

    font-size: 9px;

    font-weight: 900;

    letter-spacing: 1px;

}


.nav-button {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 11px;

    padding:
        11px 12px;

    margin-bottom: 3px;

    border: 0;

    border-radius: 9px;

    background:
        transparent;

    color:
        #899198;

    cursor: pointer;

    text-align: left;

    font-size: 12px;

    transition:
        background .2s,
        color .2s,
        transform .2s;

}


.nav-button:hover {

    background:
        #14181b;

    color:
        white;

    transform:
        translateX(2px);

}


.nav-button.active {

    background:
        linear-gradient(
            90deg,
            #103526,
            #0d241b
        );

    color:
        var(--green);

}


.nav-icon {

    width: 22px;

    text-align: center;

}


.nav-count {

    margin-left: auto;

    padding:
        3px 6px;

    border-radius: 5px;

    background:
        var(--red-dark);

    color:
        var(--red);

    font-size: 8px;

}


/* =========================
   MAIN
========================= */

.main {

    margin-left: 240px;

    padding:
        100px 30px 40px;

    min-height: 100vh;

}


.page {

    display: none;

    animation:
        pageIn .3s ease;

}


.page.active {

    display: block;

}


@keyframes pageIn {

    from {

        opacity: 0;

        transform:
            translateY(10px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================
   PAGE HEADER
========================= */

.page-header {

    display: flex;

    justify-content: space-between;

    align-items: flex-end;

    gap: 20px;

    margin-bottom: 25px;

}


.page-tag {

    margin-bottom: 7px;

    color:
        var(--green);

    font-size: 9px;

    font-weight: 900;

    letter-spacing: 1px;

}


.page-title {

    font-size: 28px;

    font-weight: 900;

}


.page-description {

    margin-top: 7px;

    color:
        var(--muted);

    font-size: 12px;

}


/* =========================
   BUTTON
========================= */

.btn {

    border: 0;

    border-radius: 8px;

    padding:
        10px 14px;

    cursor: pointer;

    font-size: 11px;

    font-weight: 800;

    transition:
        transform .2s,
        box-shadow .2s;

}


.btn:hover {

    transform:
        translateY(-2px);

}


.btn-green {

    background:
        var(--green);

    color: #000;

}


.btn-dark {

    background:
        #191d20;

    color:
        #ddd;

    border:
        1px solid var(--border);

}


.btn-red {

    background:
        var(--red-dark);

    color:
        var(--red);

}


/* =========================
   STATS
========================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 13px;

    margin-bottom: 18px;

}


.stat {

    position: relative;

    padding: 18px;

    background:
        linear-gradient(
            145deg,
            #111517,
            #0d1012
        );

    border:
        1px solid var(--border);

    border-radius: 13px;

    overflow: hidden;

    transition:
        transform .25s,
        border-color .25s;

}


.stat:hover {

    transform:
        translateY(-4px);

    border-color:
        #2a3337;

}


.stat-icon {

    width: 34px;
    height: 34px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 14px;

    border-radius: 8px;

    background:
        #191d20;

}


.stat-number {

    font-size: 23px;

    font-weight: 900;

}


.stat-label {

    margin-top: 5px;

    color:
        var(--muted);

    font-size: 10px;

}


.stat-line {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 2px;

    background:
        var(--green);

    transform:
        scaleX(0);

    transform-origin:
        left;

    transition:
        transform .5s;

}


.stat:hover .stat-line {

    transform:
        scaleX(1);

}


/* =========================
   PANELS
========================= */

.grid {

    display: grid;

    grid-template-columns:
        1.6fr 1fr;

    gap: 16px;

}


.panel {

    background:
        rgba(16,19,21,.9);

    border:
        1px solid var(--border);

    border-radius: 13px;

    overflow: hidden;

}


.panel-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        16px 18px;

    border-bottom:
        1px solid var(--border);

}


.panel-title {

    font-size: 13px;

    font-weight: 800;

}


.panel-sub {

    color:
        var(--muted);

    font-size: 9px;

}


.panel-body {

    padding: 18px;

}


/* =========================
   ACTIVITY
========================= */

.activity {

    display: flex;

    gap: 11px;

    padding:
        12px 0;

    border-bottom:
        1px solid #1a1e21;

}


.activity:last-child {

    border-bottom: 0;

}


.activity-icon {

    width: 31px;
    height: 31px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 8px;

    background:
        #181c1f;

}


.activity-text {

    font-size: 11px;

}


.activity-time {

    margin-top: 4px;

    color:
        var(--muted);

    font-size: 9px;

}


/* =========================
   QUICK ACTIONS
========================= */

.quick {

    width: 100%;

    padding:
        13px;

    margin-bottom: 8px;

    border:
        1px solid var(--border);

    border-radius: 9px;

    background:
        #121619;

    color:
        #ddd;

    text-align: left;

    cursor: pointer;

    transition: .2s;

}


.quick:hover {

    border-color:
        var(--green);

    transform:
        translateX(3px);

}


/* =========================
   TABLE
========================= */

.table {

    width: 100%;

    border-collapse:
        collapse;

}


.table th {

    padding:
        12px 15px;

    background:
        #0c0f11;

    color:
        #626a70;

    font-size: 8px;

    text-align: left;

    text-transform:
        uppercase;

}


.table td {

    padding:
        13px 15px;

    border-top:
        1px solid #1a1e21;

    font-size: 11px;

}


.user {

    display: flex;

    align-items: center;

    gap: 9px;

}


.user-avatar {

    width: 30px;
    height: 30px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 8px;

    background:
        #191d20;

}


.user-name {

    font-weight: 800;

}


.user-id {

    margin-top: 2px;

    color:
        var(--muted);

    font-size: 8px;

}


/* =========================
   STATUS
========================= */

.status {

    display: inline-flex;

    align-items: center;

    gap: 5px;

    padding:
        5px 8px;

    border-radius: 5px;

    font-size: 8px;

    font-weight: 900;

}


.status.green {

    background:
        var(--green-dark);

    color:
        var(--green);

}


.status.red {

    background:
        var(--red-dark);

    color:
        var(--red);

}


.status.yellow {

    background:
        #3a300b;

    color:
        var(--yellow);

}


/* =========================
   SEARCH
========================= */

.search {

    width: 100%;

    padding:
        11px 13px;

    margin-bottom: 15px;

    background:
        #0c0f11;

    color:
        white;

    border:
        1px solid var(--border);

    border-radius: 8px;

    outline: none;

    font-size: 11px;

}


.search:focus {

    border-color:
        var(--green);

}


/* =========================
   PRODUCT CARDS
========================= */

.products {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(240px,1fr)
        );

    gap: 14px;

}


.product {

    padding: 20px;

    background:
        #101416;

    border:
        1px solid var(--border);

    border-radius: 13px;

    transition: .25s;

}


.product:hover {

    transform:
        translateY(-5px);

    border-color:
        #344039;

}


.product-icon {

    width: 42px;
    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 14px;

    border-radius: 10px;

    background:
        #19201d;

    font-size: 20px;

}


.product-name {

    font-size: 15px;

    font-weight: 900;

}


.product-description {

    margin:
        8px 0 15px;

    color:
        var(--muted);

    font-size: 10px;

    line-height: 1.5;

}


.product-price {

    color:
        var(--green);

    font-size: 18px;

    font-weight: 900;

}


/* =========================
   ADMIN
========================= */

.admin-list {

    display: grid;

    gap: 9px;

}


.admin {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    padding: 14px;

    background:
        #111517;

    border:
        1px solid var(--border);

    border-radius: 10px;

    transition: .2s;

}


.admin:hover {

    border-color:
        #30383c;

}


.admin-info {

    display: flex;

    align-items: center;

    gap: 10px;

}


.admin-avatar {

    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 9px;

    background:
        #1a1f22;

}


.admin-role {

    margin-top: 3px;

    color:
        var(--green);

    font-size: 8px;

}


/* =========================
   EMPTY
========================= */

.empty {

    padding: 35px;

    color:
        var(--muted);

    text-align: center;

    font-size: 11px;

}


/* =========================
   TOAST
========================= */

.toast {

    position: fixed;

    right: 25px;

    bottom: 25px;

    z-index: 5000;

    padding:
        13px 16px;

    background:
        #15191b;

    border:
        1px solid var(--border);

    border-left:
        3px solid var(--green);

    border-radius: 9px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.5);

    font-size: 11px;

    transform:
        translateY(80px);

    opacity: 0;

    transition: .3s;

}


.toast.show {

    transform:
        translateY(0);

    opacity: 1;

}


/* =========================
   MOBILE
========================= */

@media(max-width:950px) {

    .stats {

        grid-template-columns:
            repeat(2,1fr);

    }

    .grid {

        grid-template-columns:
            1fr;

    }

}


@media(max-width:700px) {

    .sidebar {

        width: 100%;

        height: 58px;

        top: 70px;

        bottom: auto;

        padding: 5px;

        display: flex;

        overflow-x: auto;

        border-right: 0;

        border-bottom:
            1px solid var(--border);

    }

    .section-label {

        display: none;

    }

    .nav-button {

        min-width: 105px;

        justify-content: center;

        margin: 0 2px;

    }

    .main {

        margin-left: 0;

        padding:
            145px 14px 30px;

    }

    .system-status {

        display: none;

    }

    .profile-name,
    .profile-role {

        display: none;

    }

    .stats {

        gap: 8px;

    }

    .stat {

        padding: 14px;

    }

    .stat-number {

        font-size: 19px;

    }

    .page-header {

        align-items:
            flex-start;

        flex-direction:
            column;

    }

    .table {

        min-width: 700px;

    }

    .panel {

        overflow-x: auto;

    }

}

</style>

</head>

<!-- LOADING -->

    class="loading"

>

    <div class="loader"></div>

</div>
