
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Central+ • Login Administrativo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #080808;
            color: white;

            font-family: Arial, sans-serif;
        }


        .login-container {
            width: 90%;
            max-width: 400px;

            background: #111;

            border: 1px solid #222;
            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, .45);
        }


        .logo {
            text-align: center;

            font-size: 28px;
            font-weight: bold;

            margin-bottom: 8px;
        }


        .logo span {
            color: #00ff88;
        }


        .subtitulo {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }


        .campo {
            margin-bottom: 15px;
        }


        .campo label {
            display: block;

            margin-bottom: 7px;

            color: #aaa;

            font-size: 13px;
        }


        .campo input {
            width: 100%;

            padding: 14px;

            background: #1a1a1a;

            border: 1px solid #333;
            border-radius: 10px;

            color: white;

            outline: none;

            font-size: 14px;
        }


        .campo input:focus {
            border-color: #00ff88;
        }


        .botao-login {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;
            border-radius: 10px;

            background: #00ff88;
            color: #000;

            font-weight: bold;

            cursor: pointer;

            font-size: 14px;
        }


        .botao-login:hover {
            opacity: .9;
        }


        .erro {
            display: none;

            margin-top: 15px;

            padding: 10px;

            background: #321313;

            border: 1px solid #552222;

            border-radius: 8px;

            color: #ff6666;

            text-align: center;

            font-size: 13px;
        }


        .voltar {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #777;

            text-decoration: none;

            font-size: 13px;
        }


        .voltar:hover {
            color: white;
        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="logo">

            Central<span>+</span>

        </div>


        <div class="subtitulo">

            Área exclusiva para administradores

        </div>



        <div class="campo">

            <label for="usuario">
                Usuário
            </label>

            <input
                type="text"
                id="usuario"
                placeholder="Digite seu usuário"
                autocomplete="username"
            >

        </div>



        <div class="campo">

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
            >

        </div>



        <button
            class="botao-login"
            onclick="entrar()"
        >

            🔐 Entrar no painel

        </button>



        <div
            class="erro"
            id="erro"
        >

            Usuário ou senha incorretos.

        </div>



        <a
            href="index.html"
            class="voltar"
        >

            ← Voltar para o site

        </a>


    </div>



    <script>


        function entrar() {


            const usuario =
                document
                    .getElementById("usuario")
                    .value
                    .trim();


            const senha =
                document
                    .getElementById("senha")
                    .value;



            /*
            ==================================
               DADOS DO ADMINISTRADOR
            ==================================

               TROQUE ESTES DOIS VALORES.

            */

            const usuarioCorreto =
                "admin";


            const senhaCorreta =
                "Central123";



            if (
                usuario === usuarioCorreto &&
                senha === senhaCorreta
            ) {


                sessionStorage.setItem(
                    "centralAdmin",
                    "true"
                );


                window.location.href =
                    "admin.html";


            } else {


                document
                    .getElementById("erro")
                    .style.display =
                    "block";


            }

        }



        /*
        ==================================
           ENTER PARA ENTRAR
        ==================================
        */

        document
            .getElementById("senha")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        entrar();

                    }

                }
            );


    </script>


</body>

</html>
