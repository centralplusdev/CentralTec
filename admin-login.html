<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Central+ • Login</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;

    background:
        radial-gradient(circle at 20% 0%, rgba(0,232,135,.12), transparent 35%),
        #060708;

    color: #fff;
    font-family: Arial, sans-serif;
}

.login {
    width: min(410px, 100%);
    padding: 35px;

    background: #101315;
    border: 1px solid #202529;
    border-radius: 18px;

    box-shadow: 0 30px 80px rgba(0,0,0,.55);
}

.logo {
    text-align: center;
    margin-bottom: 28px;
}

.logo-icon {
    width: 58px;
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 14px;

    background: #00e887;
    color: #000;

    border-radius: 15px;
    font-weight: 900;
}

.logo h1 {
    font-size: 26px;
}

.logo span {
    color: #00e887;
}

.logo p {
    margin-top: 7px;
    color: #858d94;
    font-size: 11px;
}

label {
    display: block;
    margin: 16px 0 7px;

    color: #858d94;
    font-size: 10px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;

    background: #0c0f11;
    color: #fff;

    border: 1px solid #202529;
    border-radius: 9px;

    outline: none;
}

input:focus {
    border-color: #00e887;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;

    border: 0;
    border-radius: 9px;

    background: #00e887;
    color: #000;

    font-weight: 900;
    cursor: pointer;
}

button:hover {
    filter: brightness(1.08);
}

.error {
    min-height: 18px;
    margin-top: 12px;

    color: #ff5964;
    text-align: center;

    font-size: 10px;
}

.footer {
    margin-top: 25px;

    color: #515960;
    text-align: center;

    font-size: 9px;
}
</style>
</head>

<body>

<div class="login">

    <div class="logo">

        <div class="logo-icon">
            C+
        </div>

        <h1>
            Central<span>+</span>
        </h1>

        <p>
            Painel administrativo
        </p>

    </div>

    <form id="loginForm">

        <label>
            Usuário
        </label>

        <input
            id="usuario"
            type="text"
            placeholder="Digite seu usuário"
            required
        >

        <label>
            Senha
        </label>

        <input
            id="senha"
            type="password"
            placeholder="Digite sua senha"
            required
        >

        <button type="submit">
            Entrar no painel
        </button>

        <div
            class="error"
            id="error"
        ></div>

    </form>

    <div class="footer">
        Central+ • Administração
    </div>

</div>

<script>

document
.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const usuario =
        document.getElementById("usuario").value.trim();

    const senha =
        document.getElementById("senha").value;

    const error =
        document.getElementById("error");

    /*
       PROTÓTIPO
       Trocaremos isso por autenticação
       no servidor posteriormente.
    */

    if (
        usuario === "Central" &&
        senha === "Ninja"
    ) {

        sessionStorage.setItem(
            "centralAdmin",
            "true"
        );

        window.location.href = "admin.html";

    } else {

        error.textContent =
            "Usuário ou senha incorretos.";

    }

});

</script>

</body>
</html>
