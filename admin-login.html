<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Central+ • Administração</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:25px;

    font-family:Arial,Helvetica,sans-serif;

    background:
        radial-gradient(
            circle at center,
            #172033 0%,
            #080b12 45%,
            #030408 100%
        );

    color:white;

    overflow:hidden;
}


/* =========================
   ANIMAÇÃO
========================= */

.intro{

    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    background:#030408;

    z-index:9999;

    animation:
        desaparecer 1s ease 2.8s forwards;
}


.intro-logo{

    font-size:58px;

    font-weight:800;

    letter-spacing:-3px;

    opacity:0;

    transform:scale(.7);

    animation:
        aparecerLogo 1.2s ease forwards,
        pulsar 1.5s ease 1.1s infinite;
}


.intro-logo span{
    color:#00e887;
}


@keyframes aparecerLogo{

    0%{
        opacity:0;
        transform:scale(.7);
        filter:blur(10px);
    }

    100%{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }

}


@keyframes pulsar{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

}


@keyframes desaparecer{

    to{
        opacity:0;
        visibility:hidden;
    }

}


/* =========================
   LOGIN
========================= */

.login-box{

    width:100%;

    max-width:410px;

    padding:35px;

    background:#101315;

    border:1px solid #202529;

    border-radius:18px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.55);

    opacity:0;

    transform:translateY(35px);

    animation:
        entrarLogin 1s ease 3s forwards;
}


@keyframes entrarLogin{

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================
   LOGO
========================= */

.logo{

    text-align:center;

    margin-bottom:28px;
}


.logo-icon{

    width:58px;

    height:58px;

    display:flex;

    align-items:center;

    justify-content:center;

    margin:0 auto 14px;

    background:#00e887;

    color:#000;

    border-radius:15px;

    font-weight:900;

    font-size:18px;
}


.logo h1{
    font-size:27px;
}


.logo span{
    color:#00e887;
}


.logo p{

    margin-top:7px;

    color:#858d94;

    font-size:11px;
}


/* =========================
   TEXTO
========================= */

.tag{

    text-align:center;

    color:#00e887;

    font-size:10px;

    font-weight:bold;

    letter-spacing:2px;

    margin-bottom:10px;
}


h2{

    text-align:center;

    font-size:28px;
}


.descricao{

    margin:10px 0 25px;

    text-align:center;

    color:#858d94;

    font-size:12px;
}


/* =========================
   CAMPOS
========================= */

.campo{
    margin-bottom:16px;
}


.campo label{

    display:block;

    margin-bottom:7px;

    color:#dce2eb;

    font-size:11px;

    font-weight:bold;
}


.campo input{

    width:100%;

    padding:14px;

    background:#0c0f11;

    color:white;

    border:1px solid #202529;

    border-radius:10px;

    outline:none;

    font-size:13px;
}


.campo input:focus{

    border-color:#00e887;

    box-shadow:
        0 0 0 3px rgba(0,232,135,.12);
}


/* =========================
   BOTÃO
========================= */

.botao{

    width:100%;

    padding:14px;

    margin-top:5px;

    border:0;

    border-radius:10px;

    background:#00e887;

    color:#000;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}


.botao:hover{

    transform:translateY(-2px);

    filter:brightness(1.08);
}


.botao:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;
}


/* =========================
   MENSAGEM
========================= */

.mensagem{

    min-height:20px;

    margin-top:15px;

    text-align:center;

    font-size:11px;

    color:#ff5964;
}


.sucesso{
    color:#00e887;
}


/* =========================
   RODAPÉ
========================= */

.footer{

    margin-top:25px;

    text-align:center;

    color:#515960;

    font-size:9px;
}


@media(max-width:500px){

    .intro-logo{
        font-size:46px;
    }

    .login-box{
        padding:28px 22px;
    }

}

</style>

</head>


<body>


<!-- ANIMAÇÃO -->

<div class="intro">

    <div class="intro-logo">

        Central<span>+</span>

    </div>

</div>


<!-- LOGIN ADMIN -->

<div class="login-box">


    <div class="logo">

        <div class="logo-icon">
            C+
        </div>

        <h1>
            Central<span>+</span>
        </h1>

        <p>
            Painel administrativo
        </p>

    </div>


    <div class="tag">
        ACESSO ADMINISTRATIVO
    </div>


    <h2>
        Bem-vindo
    </h2>


    <p class="descricao">
        Entre para acessar o painel administrativo.
    </p>


    <form id="adminLoginForm">


        <div class="campo">

            <label for="adminEmail">
                E-mail
            </label>

            <input
                id="adminEmail"
                type="email"
                placeholder="admin@email.com"
                autocomplete="email"
                required
            >

        </div>


        <div class="campo">

            <label for="adminSenha">
                Senha
            </label>

            <input
                id="adminSenha"
                type="password"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            class="botao"
            id="adminLoginButton"
            type="submit"
        >
            Entrar no painel →
        </button>


    </form>


    <div
        id="mensagem"
        class="mensagem"
    ></div>


    <div class="footer">

        Central+ • Administração • 2026

    </div>


</div>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
    "https://meaxcosoblauhokxputd.supabase.co";


const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lYXhjb3NvYmxhdWhva3hwdXRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0OTAyNjYsImV4cCI6MjEwMzA2NjI2Nn0.qdrJWtHsQfxM4aK-SgmIhSdGWGrPVWvPqb_-RyZDnWk";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================
   ELEMENTOS
===================================== */

const formulario =
    document.getElementById(
        "adminLoginForm"
    );


const mensagem =
    document.getElementById(
        "mensagem"
    );


const botao =
    document.getElementById(
        "adminLoginButton"
    );


/* =====================================
   LOGIN
===================================== */

formulario.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        mensagem.className =
            "mensagem";

        mensagem.textContent =
            "Verificando acesso...";

        botao.disabled = true;


        const email =
            document
                .getElementById("adminEmail")
                .value
                .trim();


        const senha =
            document
                .getElementById("adminSenha")
                .value;


        try{

            /* =========================
               1. AUTENTICAR
            ========================= */

            const { data, error } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email: email,

                        password: senha

                    });


            if(error){

                console.error(error);

                mensagem.textContent =
                    "E-mail ou senha incorretos.";

                botao.disabled = false;

                return;
            }


            if(!data.user){

                mensagem.textContent =
                    "Não foi possível identificar o usuário.";

                botao.disabled = false;

                return;
            }


            /* =========================
               2. PEGAR USUÁRIO
            ========================= */

            const usuarioId =
                data.user.id;


            /* =========================
               3. VERIFICAR ADMIN
            ========================= */

            const { data: admin, error: adminError } =
                await supabaseClient
                    .from("admins")
                    .select(
                        "id, nome, cargo, nivel, ativo"
                    )
                    .eq("id", usuarioId)
                    .maybeSingle();


            if(adminError){

                console.error(adminError);

                await supabaseClient.auth.signOut();

                mensagem.textContent =
                    "Erro ao verificar suas permissões.";

                botao.disabled = false;

                return;
            }


            /* =========================
               4. NÃO É ADMIN
            ========================= */

            if(!admin){

                await supabaseClient.auth.signOut();

                mensagem.textContent =
                    "Acesso negado. Esta conta não possui permissão administrativa.";

                botao.disabled = false;

                return;
            }


            /* =========================
               5. ADMIN DESATIVADO
            ========================= */

            if(admin.ativo !== true){

                await supabaseClient.auth.signOut();

                mensagem.textContent =
                    "Acesso bloqueado. Sua conta administrativa está desativada.";

                botao.disabled = false;

                return;
            }


            /* =========================
               6. ACESSO AUTORIZADO
            ========================= */

            sessionStorage.setItem(
                "centralAdmin",
                "true"
            );


            sessionStorage.setItem(
                "adminNome",
                admin.nome
            );


            sessionStorage.setItem(
                "adminCargo",
                admin.cargo
            );


            sessionStorage.setItem(
                "adminNivel",
                String(admin.nivel)
            );


            mensagem.className =
                "mensagem sucesso";


            mensagem.textContent =
                "Acesso autorizado!";


            setTimeout(
                function(){

                    window.location.href =
                        "admin.html";

                },
                600
            );


        }catch(error){

            console.error(error);

            mensagem.textContent =
                "Erro inesperado ao processar o login.";

            botao.disabled = false;

        }

    }
);

</script>


</body>

</html>
