<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Central+ • Login Administrativo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top,
                    #123528 0%,
                    #080a0b 40%,
                    #050606 100%
                );

            color: #f2f4f5;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        .background {

            position: fixed;

            inset: 0;

            pointer-events: none;

            overflow: hidden;

        }


        .glow {

            position: absolute;

            width: 350px;

            height: 350px;

            border-radius: 50%;

            background: #00e887;

            opacity: .06;

            filter: blur(90px);

        }


        .glow.one {

            top: -120px;

            left: -100px;

        }


        .glow.two {

            right: -120px;

            bottom: -120px;

        }


        .login-container {

            position: relative;

            width: 100%;

            max-width: 430px;

        }


        .logo {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 11px;

            margin-bottom: 25px;

        }


        .logo-icon {

            width: 45px;

            height: 45px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            background: #00e887;

            color: #000;

            font-size: 15px;

            font-weight: 900;

            box-shadow:
                0 0 30px rgba(
                    0,
                    232,
                    135,
                    .15
                );

        }


        .logo-name {

            font-size: 23px;

            font-weight: 800;

        }


        .logo-name span {

            color: #00e887;

        }


        .card {

            padding: 32px;

            background:
                rgba(
                    14,
                    17,
                    19,
                    .94
                );

            border:
                1px solid #22272b;

            border-radius: 17px;

            box-shadow:
                0 25px 70px rgba(
                    0,
                    0,
                    0,
                    .45
                );

            backdrop-filter:
                blur(20px);

        }


        .tag {

            margin: 0 0 9px;

            color: #00e887;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1.2px;

        }


        h1 {

            margin: 0;

            font-size: 25px;

        }


        .description {

            margin:
                9px 0 25px;

            color: #858b91;

            font-size: 12px;

            line-height: 1.5;

        }


        .field {

            margin-bottom: 17px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #aeb4b9;

            font-size: 11px;

            font-weight: 700;

        }


        .input-box {

            position: relative;

        }


        input {

            width: 100%;

            height: 46px;

            padding:
                0 13px;

            background: #0a0c0e;

            color: #fff;

            border:
                1px solid #252a2e;

            border-radius: 9px;

            outline: none;

            font-size: 13px;

            transition: .2s;

        }


        input:focus {

            border-color: #00e887;

            box-shadow:
                0 0 0 3px rgba(
                    0,
                    232,
                    135,
                    .07
                );

        }


        input::placeholder {

            color: #4f555a;

        }


        .password-button {

            position: absolute;

            top: 50%;

            right: 12px;

            transform:
                translateY(-50%);

            border: 0;

            background: transparent;

            color: #777;

            cursor: pointer;

            font-size: 15px;

        }


        .password-button:hover {

            color: #00e887;

        }


        .login-button {

            width: 100%;

            height: 47px;

            margin-top: 5px;

            border: 0;

            border-radius: 9px;

            background: #00e887;

            color: #000;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;

            transition: .2s;

        }


        .login-button:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 8px 25px rgba(
                    0,
                    232,
                    135,
                    .16
                );

        }


        .login-button:active {

            transform:
                translateY(0);

        }


        .error {

            display: none;

            margin-top: 14px;

            padding: 10px;

            background: #301619;

            border:
                1px solid #542126;

            border-radius: 8px;

            color: #ff6c73;

            font-size: 11px;

            text-align: center;

        }


        .security {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            margin-top: 20px;

            color: #555c62;

            font-size: 10px;

        }


        .security-dot {

            width: 6px;

            height: 6px;

            border-radius: 50%;

            background: #00e887;

        }


        .footer {

            margin-top: 18px;

            color: #4e5459;

            font-size: 10px;

            text-align: center;

        }


        @media (max-width: 500px) {

            .card {

                padding: 25px 20px;

            }

        }

    </style>

</head>


<body>


<div class="background">

    <div class="glow one"></div>

    <div class="glow two"></div>

</div>



<div class="login-container">


    <div class="logo">

        <div class="logo-icon">
            C+
        </div>

        <div class="logo-name">
            Central<span>+</span>
        </div>

    </div>



    <div class="card">


        <p class="tag">
            ÁREA RESTRITA
        </p>


        <h1>
            Painel Administrativo
        </h1>


        <p class="description">

            Entre com suas credenciais para
            acessar o gerenciamento da Central+.

        </p>



        <form id="loginForm">


            <div class="field">

                <label for="usuario">
                    Usuário
                </label>

                <input
                    id="usuario"
                    type="text"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    required
                >

            </div>



            <div class="field">

                <label for="senha">
                    Senha
                </label>


                <div class="input-box">

                    <input
                        id="senha"
                        type="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="password-button"
                        id="mostrarSenha"
                    >
                        👁
                    </button>

                </div>

            </div>



            <button
                type="submit"
                class="login-button"
            >

                Entrar no painel →

            </button>


            <div
                class="error"
                id="erro"
            >

                Usuário ou senha incorretos.

            </div>


        </form>



        <div class="security">

            <span class="security-dot"></span>

            Área protegida da Central+

        </div>


    </div>


    <div class="footer">

        © 2026 Central+ • Acesso administrativo

    </div>


</div>



<script>


/* =================================
   LOGIN
================================= */

const form =
    document.getElementById(
        "loginForm"
    );


const usuario =
    document.getElementById(
        "usuario"
    );


const senha =
    document.getElementById(
        "senha"
    );


const erro =
    document.getElementById(
        "erro"
    );



form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const user =
            usuario.value.trim();


        const pass =
            senha.value;


        /*
            CREDENCIAIS
        */

        if (
            user === "Central" &&
            pass === "Ninja"
        ) {


            sessionStorage.setItem(
                "centralAdmin",
                "true"
            );


            window.location.href =
                "admin.html";


        } else {


            erro.style.display =
                "block";


            senha.value = "";


            senha.focus();


            setTimeout(
                function() {

                    erro.style.display =
                        "none";

                },
                3000
            );

        }

    }
);



/* =================================
   MOSTRAR SENHA
================================= */

document
    .getElementById(
        "mostrarSenha"
    )
    .addEventListener(
        "click",
        function() {


            if (
                senha.type ===
                "password"
            ) {

                senha.type =
                    "text";

                this.textContent =
                    "🙈";

            } else {

                senha.type =
                    "password";

                this.textContent =
                    "👁";

            }

        }
    );


</script>


</body>

</html>
