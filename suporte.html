
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Suporte - Central+</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            min-height: 100vh;
        }

        .suporte-container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .chat {
            background: #111;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #222;
        }

        .chat-header h2 {
            margin: 0;
        }

        .status {
            color: #00ff88;
            font-size: 13px;
            margin-top: 5px;
        }

        .mensagens {
            min-height: 350px;
            max-height: 500px;
            overflow-y: auto;
            padding: 20px;
        }

        .mensagem {
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .cliente {
            background: #222;
            margin-right: auto;
        }

        .sistema {
            background: #003d28;
            margin-left: auto;
        }

        .mensagem small {
            display: block;
            margin-top: 5px;
            opacity: 0.6;
        }

        .comprovante {
            padding: 20px;
            border-top: 1px solid #222;
        }

        .campo {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .campo input[type="text"] {
            flex: 1;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #1b1b1b;
            color: white;
            outline: none;
        }

        .campo button {
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            background: #00ff88;
            color: #000;
        }

        .arquivo {
            margin-top: 15px;
        }

        .enviar-comprovante {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .aviso {
            color: #999;
            font-size: 13px;
            margin-top: 10px;
        }

    </style>

</head>


<body>


    <header class="topo">

        <div class="logo">
            Central<span>+</span>
        </div>

        <nav>
            <a href="index.html">
                Início
            </a>
        </nav>

    </header>



    <main>

        <div class="suporte-container">

            <div class="chat">


                <!-- CABEÇALHO -->

                <div class="chat-header">

                    <h2>
                        💬 Suporte Central+
                    </h2>

                    <div class="status">
                        ● Atendimento disponível
                    </div>

                </div>



                <!-- MENSAGENS -->

                <div
                    class="mensagens"
                    id="mensagens"
                >

                    <div class="mensagem sistema">

                        Olá! 👋

                        <br><br>

                        Envie o comprovante do seu pagamento
                        abaixo para que possamos analisar
                        seu pedido.

                        <small>
                            Central+
                        </small>

                    </div>

                </div>



                <!-- MENSAGEM -->

                <div class="comprovante">

                    <label>
                        Mensagem
                    </label>

                    <div class="campo">

                        <input
                            type="text"
                            id="mensagemInput"
                            placeholder="Digite sua mensagem..."
                        >

                        <button onclick="enviarMensagem()">
                            Enviar
                        </button>

                    </div>



                    <!-- COMPROVANTE -->

                    <div class="arquivo">

                        <label>
                            📎 Comprovante de pagamento
                        </label>

                        <input
                            type="file"
                            id="comprovante"
                            accept="image/*,.pdf"
                        >

                    </div>


                    <button
                        class="enviar-comprovante"
                        onclick="enviarComprovante()"
                    >
                        📤 Enviar comprovante
                    </button>


                    <p class="aviso">
                        Envie apenas o comprovante referente
                        ao pagamento do seu pedido.
                    </p>

                </div>

            </div>

        </div>

    </main>



    <footer>

        <p>
            © 2026 Central+ • Todos os direitos reservados.
        </p>

    </footer>



    <script>


        function enviarMensagem() {

            const input =
                document.getElementById("mensagemInput");

            const texto =
                input.value.trim();


            if (texto === "") {

                alert("Digite uma mensagem.");

                return;

            }


            const mensagens =
                document.getElementById("mensagens");


            const novaMensagem =
                document.createElement("div");


            novaMensagem.className =
                "mensagem cliente";


            novaMensagem.innerHTML =
                texto +
                "<small>Você</small>";


            mensagens.appendChild(novaMensagem);


            input.value = "";


            mensagens.scrollTop =
                mensagens.scrollHeight;

        }



        function enviarComprovante() {

            const arquivo =
                document.getElementById("comprovante");


            if (arquivo.files.length === 0) {

                alert("Selecione seu comprovante primeiro.");

                return;

            }


            const mensagens =
                document.getElementById("mensagens");


            const novaMensagem =
                document.createElement("div");


            novaMensagem.className =
                "mensagem cliente";


            novaMensagem.innerHTML =
                "📎 Comprovante enviado!" +
                "<small>Você</small>";


            mensagens.appendChild(novaMensagem);


            mensagens.scrollTop =
                mensagens.scrollHeight;


            alert(
                "Comprovante selecionado! Na próxima etapa vamos conectar isso ao servidor para você receber o arquivo."
            );

        }


    </script>


</body>

</html>
