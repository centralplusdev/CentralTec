<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Central+</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <div class="login-box">

            <div class="logo login-logo">
                Central<span>+</span>
            </div>

            <p class="tag">ACESSO RESTRITO</p>

            <h1>Entrar</h1>

            <p class="login-descricao">
                Entre para acessar os recursos da Central+.
            </p>

            <form id="loginForm">

                <div class="campo">

                    <label for="usuario">
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button type="submit" class="botao login-botao">
                    Entrar →
                </button>

            </form>

            <p id="mensagem" class="login-mensagem"></p>

        </div>

    </main>


    <script>

        const formulario = document.getElementById("loginForm");
        const mensagem = document.getElementById("mensagem");

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            const usuario = document.getElementById("usuario").value;
            const senha = document.getElementById("senha").value;

            if (usuario === "CentralTech" && senha === "Tech") {

                sessionStorage.setItem("centralLogin", "true");

                window.location.href = "index.html";

            } else {

                mensagem.textContent = "Usuário ou senha incorretos.";
                mensagem.style.display = "block";

            }

        });

    </script>

</body>

</html>
