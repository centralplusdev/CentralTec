<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Central+ | Acesso</title>

    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    #172033 0%,
                    #080b12 45%,
                    #030408 100%
                );

            color: white;

            overflow: hidden;

        }


        /* =========================
           INTRO
        ========================= */

        .intro {

            position: fixed;

            inset: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #030408;

            z-index: 10;

            animation:
                desaparecer 1s ease 2.8s forwards;

        }


        .intro-logo {

            font-size: 58px;

            font-weight: 800;

            letter-spacing: -3px;

            opacity: 0;

            transform: scale(.7);

            animation:
                aparecerLogo 1.2s ease forwards,
                pulsar 1.5s ease 1.1s infinite;

        }


        .intro-logo span {

            color: #4da3ff;

        }


        @keyframes aparecerLogo {

            0% {

                opacity: 0;

                transform: scale(.7);

                filter: blur(10px);

            }

            100% {

                opacity: 1;

                transform: scale(1);

                filter: blur(0);

            }

        }


        @keyframes pulsar {

            0%, 100% {

                transform: scale(1);

            }

            50% {

                transform: scale(1.05);

            }

        }


        @keyframes desaparecer {

            to {

                opacity: 0;

                visibility: hidden;

            }

        }


        /* =========================
           LOGIN
        ========================= */

        .login-page {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;

        }


        .login-box {

            width: 100%;

            max-width: 400px;

            text-align: center;

            opacity: 0;

            transform: translateY(35px);

            animation:
                entrarLogin 1s ease 3s forwards;

        }


        @keyframes entrarLogin {

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }


        .mini-logo {

            font-size: 28px;

            font-weight: 800;

            margin-bottom: 12px;

        }


        .mini-logo span {

            color: #4da3ff;

        }


        .tag {

            font-size: 11px;

            letter-spacing: 3px;

            color: #4da3ff;

            font-weight: bold;

            margin-bottom: 10px;

        }


        h1 {

            margin: 0;

            font-size: 38px;

        }


        .descricao {

            color: #8f99aa;

            margin: 12px 0 35px;

        }


        .campo {

            text-align: left;

            margin-bottom: 18px;

        }


        .campo label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            color: #dce2eb;

        }


        .campo input {

            width: 100%;

            padding: 16px 18px;

            border: 1px solid #252d3b;

            border-radius: 12px;

            background: rgba(15, 19, 28, .85);

            color: white;

            outline: none;

            font-size: 15px;

            transition: .25s;

        }


        .campo input:focus {

            border-color: #4da3ff;

            box-shadow:
                0 0 0 3px rgba(77, 163, 255, .12);

        }


        .login-botao {

            width: 100%;

            margin-top: 8px;

            padding: 16px;

            border: none;

            border-radius: 12px;

            background: #4da3ff;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: .25s;

        }


        .login-botao:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 30px rgba(77, 163, 255, .2);

        }


        .login-botao:disabled {

            opacity: .6;

            cursor: not-allowed;

            transform: none;

        }


        .alternar {

            margin-top: 18px;

            color: #8f99aa;

            font-size: 13px;

        }


        .alternar button {

            border: none;

            background: none;

            color: #4da3ff;

            font-weight: bold;

            cursor: pointer;

            font-size: 13px;

        }


        .mensagem {

            min-height: 20px;

            margin-top: 18px;

            color: #ff6b6b;

            font-size: 14px;

        }


        .mensagem.sucesso {

            color: #00e887;

        }


        .footer {

            margin-top: 25px;

            color: #515960;

            font-size: 9px;

        }


        @media (max-width: 500px) {

            .intro-logo {

                font-size: 46px;

            }

            h1 {

                font-size: 32px;

            }

            .login-page {

                padding: 22px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         INTRO
    ========================= -->

    <div class="intro">

        <div class="intro-logo">

            Central<span>+</span>

        </div>

    </div>


    <!-- =========================
         LOGIN
    ========================= -->

    <main class="login-page">

        <div class="login-box">


            <div class="mini-logo">

                Central<span>+</span>

            </div>


            <div
                class="tag"
                id="tag"
            >

                ACESSO RESTRITO

            </div>


            <h1 id="titulo">

                Bem-vindo

            </h1>


            <p
                class="descricao"
                id="descricao"
            >

                Entre para acessar a Central+.

            </p>


            <form id="loginForm">


                <!-- NOME -->

                <div
                    class="campo"
                    id="campoNome"
                    style="display:none;"
                >

                    <label for="nome">

                        Nome

                    </label>


                    <input

                        type="text"

                        id="nome"

                        placeholder="Digite seu nome"

                        autocomplete="name"

                    >

                </div>


                <!-- EMAIL -->

                <div class="campo">

                    <label for="email">

                        Email

                    </label>


                    <input

                        type="email"

                        id="email"

                        placeholder="Digite seu email"

                        autocomplete="email"

                        required

                    >

                </div>


                <!-- SENHA -->

                <div class="campo">

                    <label for="senha">

                        Senha

                    </label>


                    <input

                        type="password"

                        id="senha"

                        placeholder="Digite sua senha"

                        autocomplete="current-password"

                        minlength="6"

                        required

                    >

                </div>


                <button

                    type="submit"

                    class="login-botao"

                    id="botao"

                >

                    Entrar →

                </button>


            </form>


            <div class="alternar">

                <span id="textoAlternar">

                    Ainda não possui uma conta?

                </span>


                <button
                    type="button"
                    id="alternarModo"
                >

                    Criar conta

                </button>

            </div>


            <p

                id="mensagem"

                class="mensagem"

            ></p>


            <div class="footer">

                Central+ • Acesso seguro

            </div>


        </div>

    </main>


    <script>

        /* =========================
           SUPABASE
        ========================= */

        const SUPABASE_URL =
            "https://meaxcosoblauhokxputd.supabase.co";


        const SUPABASE_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lYXhjb3NvYmxhdWhva3hwdXRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0OTAyNjYsImV4cCI6MjEwMzA2NjI2Nn0.qdrJWtHsQfxM4aK-SgmIhSdGWGrPVWvPqb_-RyZDnWk";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================
           ELEMENTOS
        ========================= */

        const formulario =
            document.getElementById("loginForm");


        const mensagem =
            document.getElementById("mensagem");


        const alternarModo =
            document.getElementById("alternarModo");


        const campoNome =
            document.getElementById("campoNome");


        const nomeInput =
            document.getElementById("nome");


        const emailInput =
            document.getElementById("email");


        const senhaInput =
            document.getElementById("senha");


        const botao =
            document.getElementById("botao");


        const titulo =
            document.getElementById("titulo");


        const descricao =
            document.getElementById("descricao");


        const tag =
            document.getElementById("tag");


        const textoAlternar =
            document.getElementById("textoAlternar");


        let modoCadastro = false;


        /* =========================
           ALTERNAR LOGIN/CADASTRO
        ========================= */

        alternarModo.addEventListener(
            "click",
            function() {

                modoCadastro =
                    !modoCadastro;


                mensagem.textContent = "";

                mensagem.classList.remove(
                    "sucesso"
                );


                if(modoCadastro){

                    campoNome.style.display =
                        "block";


                    nomeInput.required =
                        true;


                    titulo.textContent =
                        "Criar conta";


                    descricao.textContent =
                        "Crie sua conta para acessar a Central+.";


                    tag.textContent =
                        "NOVO CLIENTE";


                    botao.textContent =
                        "Criar conta →";


                    textoAlternar.textContent =
                        "Já possui uma conta?";


                    alternarModo.textContent =
                        "Entrar";


                }else{

                    campoNome.style.display =
                        "none";


                    nomeInput.required =
                        false;


                    titulo.textContent =
                        "Bem-vindo";


                    descricao.textContent =
                        "Entre para acessar a Central+.";


                    tag.textContent =
                        "ACESSO RESTRITO";


                    botao.textContent =
                        "Entrar →";


                    textoAlternar.textContent =
                        "Ainda não possui uma conta?";


                    alternarModo.textContent =
                        "Criar conta";

                }

            }
        );


        /* =========================
           LOGIN / CADASTRO
        ========================= */

        formulario.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                mensagem.textContent = "";

                mensagem.classList.remove(
                    "sucesso"
                );


                botao.disabled =
                    true;


                botao.textContent =
                    modoCadastro
                        ? "Criando conta..."
                        : "Entrando...";


                const email =
                    emailInput.value.trim();


                const senha =
                    senhaInput.value;


                try {


                    /* =====================
                       CADASTRO
                    ===================== */

                    if(modoCadastro){

                        const nome =
                            nomeInput.value.trim();


                        if(!nome){

                            throw new Error(
                                "Digite seu nome."
                            );

                        }


                        const resultado =
                            await supabaseClient.auth.signUp({

                                email: email,

                                password: senha

                            });


                        if(resultado.error){

                            throw resultado.error;

                        }


                        const usuario =
                            resultado.data.user;


                        if(!usuario){

                            throw new Error(
                                "Não foi possível criar a conta."
                            );

                        }


                        /*
                           SALVA O CLIENTE
                           NA TABELA clientes
                        */

                        const cadastroCliente =
                            await supabaseClient
                                .from("clientes")
                                .insert({

                                    id: usuario.id,

                                    nome: nome,

                                    email: email

                                });


                        if(cadastroCliente.error){

                            console.error(
                                "Erro ao salvar cliente:",
                                cadastroCliente.error
                            );

                            throw new Error(
                                "A conta foi criada, mas não foi possível salvar os dados do cliente."
                            );

                        }


                        /*
                           SESSÃO LOCAL
                           PARA O INDEX ATUAL
                        */

                        sessionStorage.setItem(
                            "centralLogin",
                            "true"
                        );


                        mensagem.textContent =
                            "Conta criada com sucesso!";


                        mensagem.classList.add(
                            "sucesso"
                        );


                        setTimeout(
                            function(){

                                window.location.href =
                                    "index.html";

                            },
                            800
                        );


                        return;

                    }


                    /* =====================
                       LOGIN
                    ===================== */

                    const resultadoLogin =
                        await supabaseClient.auth.signInWithPassword({

                            email: email,

                            password: senha

                        });


                    if(resultadoLogin.error){

                        throw resultadoLogin.error;

                    }


                    sessionStorage.setItem(
                        "centralLogin",
                        "true"
                    );


                    mensagem.textContent =
                        "Login realizado com sucesso!";


                    mensagem.classList.add(
                        "sucesso"
                    );


                    setTimeout(
                        function(){

                            window.location.href =
                                "index.html";

                        },
                        500
                    );


                }catch(error){

                    console.error(
                        "Erro de autenticação:",
                        error
                    );


                    let texto =
                        "Não foi possível realizar a operação.";


                    if(
                        error.message
                    ){

                        texto =
                            error.message;

                    }


                    /*
                       Mensagens mais amigáveis
                    */

                    if(
                        texto.includes(
                            "Invalid login credentials"
                        )
                    ){

                        texto =
                            "Email ou senha incorretos.";

                    }


                    if(
                        texto.includes(
                            "User already registered"
                        )
                    ){

                        texto =
                            "Esse email já possui uma conta.";

                    }


                    if(
                        texto.includes(
                            "Password should be at least"
                        )
                    ){

                        texto =
                            "A senha precisa ter pelo menos 6 caracteres.";

                    }


                    mensagem.textContent =
                        texto;

                    mensagem.classList.remove(
                        "sucesso"
                    );


                }finally{

                    botao.disabled =
                        false;


                    botao.textContent =
                        modoCadastro
                            ? "Criar conta →"
                            : "Entrar →";

                }

            }
        );

    </script>

</body>

</html>
