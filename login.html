<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Central+ | Acesso</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


/* =========================
   BODY
========================= */

body{

    min-height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:25px;

    font-family:Arial,sans-serif;

    background:
        radial-gradient(
            circle at center,
            #172033 0%,
            #080b12 45%,
            #030408 100%
        );

    color:white;

    overflow:hidden;

}


/* =========================
   ANIMAÇÃO INICIAL
========================= */

.intro{

    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    background:#030408;

    z-index:9999;

    animation:
        desaparecer 1s ease 2.8s forwards;

}


.intro-logo{

    font-size:58px;

    font-weight:800;

    letter-spacing:-3px;

    opacity:0;

    transform:scale(.7);

    animation:
        aparecerLogo 1.2s ease forwards,
        pulsar 1.5s ease 1.1s infinite;

}


.intro-logo span{

    color:#4da3ff;

}


@keyframes aparecerLogo{

    0%{

        opacity:0;

        transform:scale(.7);

        filter:blur(10px);

    }

    100%{

        opacity:1;

        transform:scale(1);

        filter:blur(0);

    }

}


@keyframes pulsar{

    0%,100%{

        transform:scale(1);

    }

    50%{

        transform:scale(1.05);

    }

}


@keyframes desaparecer{

    to{

        opacity:0;

        visibility:hidden;

    }

}


/* =========================
   LOGIN BOX
========================= */

.login-box{

    width:100%;

    max-width:410px;

    padding:35px;

    background:#10151d;

    border:1px solid #252d3b;

    border-radius:18px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.55);

    opacity:0;

    transform:translateY(35px);

    animation:
        entrarLogin 1s ease 3s forwards;

}


@keyframes entrarLogin{

    to{

        opacity:1;

        transform:translateY(0);

    }

}


/* =========================
   LOGO
========================= */

.logo{

    text-align:center;

    margin-bottom:28px;

}


.logo-icon{

    width:58px;

    height:58px;

    display:flex;

    align-items:center;
    justify-content:center;

    margin:0 auto 14px;

    background:#4da3ff;

    color:white;

    border-radius:15px;

    font-weight:900;

    font-size:18px;

}


.logo h1{

    font-size:27px;

}


.logo span{

    color:#4da3ff;

}


.logo p{

    margin-top:7px;

    color:#8f99aa;

    font-size:11px;

}


/* =========================
   TEXTOS
========================= */

.tag{

    text-align:center;

    color:#4da3ff;

    font-size:10px;

    font-weight:bold;

    letter-spacing:2px;

    margin-bottom:10px;

}


h2{

    text-align:center;

    font-size:28px;

}


.descricao{

    margin:10px 0 25px;

    text-align:center;

    color:#8f99aa;

    font-size:12px;

}


/* =========================
   CAMPOS
========================= */

.campo{

    margin-bottom:16px;

}


.campo label{

    display:block;

    margin-bottom:7px;

    color:#dce2eb;

    font-size:11px;

    font-weight:bold;

}


.campo input{

    width:100%;

    padding:14px;

    background:#0c1017;

    color:white;

    border:1px solid #252d3b;

    border-radius:10px;

    outline:none;

    font-size:13px;

}


.campo input:focus{

    border-color:#4da3ff;

    box-shadow:
        0 0 0 3px rgba(77,163,255,.12);

}


/* =========================
   BOTÕES
========================= */

.botao{

    width:100%;

    padding:14px;

    margin-top:5px;

    border:0;

    border-radius:10px;

    background:#4da3ff;

    color:white;

    font-weight:900;

    cursor:pointer;

    transition:.2s;

}


.botao:hover{

    transform:translateY(-2px);

    filter:brightness(1.08);

}


.botao:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;

}


/* =========================
   MENSAGEM
========================= */

.mensagem{

    min-height:20px;

    margin-top:15px;

    text-align:center;

    font-size:11px;

    color:#ff6b6b;

}


.sucesso{

    color:#4dffa3;

}


/* =========================
   TROCAR LOGIN/CADASTRO
========================= */

.trocar{

    margin-top:22px;

    text-align:center;

    color:#8f99aa;

    font-size:11px;

}


.trocar button{

    margin-left:4px;

    border:0;

    background:none;

    color:#4da3ff;

    cursor:pointer;

    font-weight:bold;

}


/* =========================
   FOOTER
========================= */

.footer{

    margin-top:25px;

    text-align:center;

    color:#515960;

    font-size:9px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .intro-logo{

        font-size:46px;

    }

    .login-box{

        padding:28px 22px;

    }

}

</style>

</head>


<body>


<!-- =========================
     ANIMAÇÃO
========================= -->

<div class="intro">

    <div class="intro-logo">

        Central<span>+</span>

    </div>

</div>


<!-- =========================
     LOGIN
========================= -->

<div class="login-box">


    <div class="logo">

        <div class="logo-icon">
            C+
        </div>

        <h1>
            Central<span>+</span>
        </h1>

        <p>
            Plataforma Central+
        </p>

    </div>


    <!-- =========================
         ÁREA DE LOGIN
    ========================= -->

    <div id="loginArea">

        <div class="tag">
            ACESSO
        </div>

        <h2>
            Bem-vindo
        </h2>

        <p class="descricao">
            Entre na sua conta Central+.
        </p>


        <form id="loginForm">

            <div class="campo">

                <label for="loginEmail">
                    E-mail
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="campo">

                <label for="loginSenha">
                    Senha
                </label>

                <input
                    id="loginSenha"
                    type="password"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                class="botao"
                id="loginButton"
                type="submit"
            >
                Entrar →
            </button>

        </form>

    </div>


    <!-- =========================
         ÁREA DE CADASTRO
    ========================= -->

    <div
        id="cadastroArea"
        style="display:none;"
    >

        <div class="tag">
            NOVA CONTA
        </div>

        <h2>
            Criar conta
        </h2>

        <p class="descricao">
            Crie sua conta na Central+.
        </p>


        <form id="cadastroForm">

            <div class="campo">

                <label for="cadastroEmail">
                    E-mail
                </label>

                <input
                    id="cadastroEmail"
                    type="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="campo">

                <label for="cadastroSenha">
                    Senha
                </label>

                <input
                    id="cadastroSenha"
                    type="password"
                    placeholder="Crie uma senha"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                class="botao"
                id="cadastroButton"
                type="submit"
            >
                Criar conta
            </button>

        </form>

    </div>


    <!-- =========================
         MENSAGEM
    ========================= -->

    <div
        id="mensagem"
        class="mensagem"
    ></div>


    <!-- =========================
         TROCAR MODO
    ========================= -->

    <div class="trocar">

        <span id="textoTrocar">
            Ainda não possui uma conta?
        </span>

        <button
            id="trocarModo"
            type="button"
        >
            Criar conta
        </button>

    </div>


    <div class="footer">
        Central+ • 2026
    </div>


</div>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
    "https://meaxcosoblauhokxputd.supabase.co";


const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lYXhjb3NvYmxhdWhva3hwdXRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0OTAyNjYsImV4cCI6MjEwMzA2NjI2Nn0.qdrJWtHsQfxM4aK-SgmIhSdGWGrPVWvPqb_-RyZDnWk";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================
   ELEMENTOS
===================================== */

const loginArea =
    document.getElementById("loginArea");


const cadastroArea =
    document.getElementById("cadastroArea");


const loginForm =
    document.getElementById("loginForm");


const cadastroForm =
    document.getElementById("cadastroForm");


const mensagem =
    document.getElementById("mensagem");


const trocarModo =
    document.getElementById("trocarModo");


const textoTrocar =
    document.getElementById("textoTrocar");


const loginButton =
    document.getElementById("loginButton");


const cadastroButton =
    document.getElementById("cadastroButton");


/* =====================================
   MODO LOGIN / CADASTRO
===================================== */

let modoCadastro = false;


trocarModo.addEventListener(
    "click",
    function(){

        modoCadastro =
            !modoCadastro;


        mensagem.textContent = "";

        mensagem.className =
            "mensagem";


        if(modoCadastro){

            loginArea.style.display =
                "none";

            cadastroArea.style.display =
                "block";

            textoTrocar.textContent =
                "Já possui uma conta?";

            trocarModo.textContent =
                "Entrar";

        }else{

            cadastroArea.style.display =
                "none";

            loginArea.style.display =
                "block";

            textoTrocar.textContent =
                "Ainda não possui uma conta?";

            trocarModo.textContent =
                "Criar conta";

        }

    }
);


/* =====================================
   LOGIN
===================================== */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        mensagem.className =
            "mensagem";

        mensagem.textContent =
            "Entrando...";


        loginButton.disabled =
            true;


        const email =
            document
                .getElementById("loginEmail")
                .value
                .trim();


        const senha =
            document
                .getElementById("loginSenha")
                .value;


        try{

            const { data, error } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email:email,

                        password:senha

                    });


            if(error){

                console.error(error);

                mensagem.textContent =
                    "E-mail ou senha incorretos.";

                loginButton.disabled =
                    false;

                return;

            }


            if(data.session){

                sessionStorage.setItem(
                    "centralLogin",
                    "true"
                );


                mensagem.className =
                    "mensagem sucesso";

                mensagem.textContent =
                    "Login realizado!";


                setTimeout(
                    function(){

                        window.location.href =
                            "index.html";

                    },
                    500
                );

            }

        }catch(error){

            console.error(error);

            mensagem.textContent =
                "Erro ao conectar ao servidor.";

            loginButton.disabled =
                false;

        }

    }
);


/* =====================================
   CADASTRO
===================================== */

cadastroForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        mensagem.className =
            "mensagem";

        mensagem.textContent =
            "Criando sua conta...";


        cadastroButton.disabled =
            true;


        const email =
            document
                .getElementById("cadastroEmail")
                .value
                .trim();


        const senha =
            document
                .getElementById("cadastroSenha")
                .value;


        try{

            const { data, error } =
                await supabaseClient.auth
                    .signUp({

                        email:email,

                        password:senha

                    });


            if(error){

                console.error(error);

                mensagem.textContent =
                    error.message;

                cadastroButton.disabled =
                    false;

                return;

            }


            /*
              Se a confirmação de e-mail
              estiver ativada no Supabase,
              não haverá sessão imediatamente.
            */

            if(data.session){

                mensagem.className =
                    "mensagem sucesso";

                mensagem.textContent =
                    "Conta criada! Entrando...";


                sessionStorage.setItem(
                    "centralLogin",
                    "true"
                );


                setTimeout(
                    function(){

                        window.location.href =
                            "index.html";

                    },
                    700
                );


            }else{

                mensagem.className =
                    "mensagem sucesso";

                mensagem.textContent =
                    "Conta criada! Verifique seu e-mail para confirmar.";

                cadastroButton.disabled =
                    false;

            }

        }catch(error){

            console.error(error);

            mensagem.textContent =
                "Erro ao criar a conta.";

            cadastroButton.disabled =
                false;

        }

    }
);


/* =====================================
   VERIFICAR SESSÃO
===================================== */

async function verificarSessao(){

    try{

        const { data } =
            await supabaseClient.auth
                .getSession();


        if(data.session){

            sessionStorage.setItem(
                "centralLogin",
                "true"
            );

        }

    }catch(error){

        console.error(
            "Erro ao verificar sessão:",
            error
        );

    }

}


verificarSessao();

</script>


</body>

</html>
